<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material | EduPequenos</title><link rel="stylesheet" href="styles.css"><script src="products.js"></script></head><body><header><div class="top shell"><a class="logo" href="index.html"><i>📖</i><span><b>Edu<em>Pequenos</em></b><small>Grandes ideias para um futuro melhor</small></span></a><a class="back" href="index.html">← Voltar à loja</a></div></header><main class="shell product-page" id="product"></main><footer><div class="shell copyright">© 2026 EduPequenos. Todos os direitos reservados.</div></footer><script>const p=PRODUCTS.find(x=>x.slug===new URLSearchParams(location.search).get("slug"));if(!p){document.querySelector("#product").innerHTML="<h1>Material não encontrado</h1>"}else{document.title=p.name+" | EduPequenos";document.querySelector("#product").innerHTML=`<p class="crumb"><a href="index.html">Início</a> › ${p.category} › ${p.name}</p><section class="detail"><div class="big-cover" style="background:${p.color}"><i>📖</i><span>${p.category}</span><h1>${p.name}</h1><small>${p.type}</small></div><div><span class="kicker">${p.category}</span><h1>${p.name}</h1><p class="lead">${p.description}</p><div class="chips">${p.years.map(y=>`<span>${y}</span>`).join("")}</div><div class="price">${p.oldPrice?`<del>${money(p.oldPrice)}</del>`:""}<strong>${money(p.price)}</strong><small>Pagamento único</small></div><button class="buy">🛒 Adicionar ao carrinho</button><p class="secure">🛡️ Compra segura e entrega por e-mail após a confirmação.</p></div></section><section class="contents"><article><h2>O que você vai receber</h2><p>${p.short}</p><ul>${p.contents.map(x=>`<li>✓ ${x}</li>`).join("")}</ul></article><aside><h3>Informações do material</h3><p><b>Formato</b><br>PDF</p><p><b>Quantidade</b><br>${p.pages} páginas</p><p><b>Indicado para</b><br>${p.years.join(", ")}</p><p><b>Entrega</b><br>Download por e-mail</p></aside></section>`}</script></body></html>
